<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFB7C5" />
    </linearGradient>
    <path id="petal" d="M0,0 C10,-10 15,-25 5,-32 C2,-35 -2,-35 -5,-32 C-15,-25 -10,-10 0,0 Z" fill="url(#petalGrad)" />
  </defs>

  <rect width="800" height="100" fill="transparent" />

  <!-- Pétalas originais -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="100,-20; 130,120" dur="5s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="5s" repeatCount="indefinite" begin="0s" />
    <g transform="scale(0.5)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="4s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="320,-30; 280,120" dur="6s" repeatCount="indefinite" begin="1.5s" />
    <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.1; 0.8; 1" dur="6s" repeatCount="indefinite" begin="1.5s" />
    <g transform="scale(0.4)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; -360" dur="5s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="500,-10; 540,120" dur="4.5s" repeatCount="indefinite" begin="0.5s" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="4.5s" repeatCount="indefinite" begin="0.5s" />
    <g transform="scale(0.6)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="3.5s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="720,-40; 670,120" dur="5.5s" repeatCount="indefinite" begin="2s" />
    <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.1; 0.8; 1" dur="5.5s" repeatCount="indefinite" begin="2s" />
    <g transform="scale(0.45)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; -360" dur="4.5s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="50,-25; 90,120" dur="6.5s" repeatCount="indefinite" begin="3s" />
    <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.1; 0.8; 1" dur="6.5s" repeatCount="indefinite" begin="3s" />
    <g transform="scale(0.55)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="5s" repeatCount="indefinite" /></use></g>
  </g>

  <!-- NOVAS PÉTALAS ADICIONADAS -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="200,-10; 180,120" dur="4.8s" repeatCount="indefinite" begin="0.8s" />
    <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.1; 0.8; 1" dur="4.8s" repeatCount="indefinite" begin="0.8s" />
    <g transform="scale(0.35)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="3.8s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="420,-20; 460,120" dur="5.2s" repeatCount="indefinite" begin="2.5s" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="5.2s" repeatCount="indefinite" begin="2.5s" />
    <g transform="scale(0.48)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; -360" dur="4.2s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="580,-15; 550,120" dur="6.2s" repeatCount="indefinite" begin="1.2s" />
    <animate attributeName="opacity" values="0; 0.7; 0.7; 0" keyTimes="0; 0.1; 0.8; 1" dur="6.2s" repeatCount="indefinite" begin="1.2s" />
    <g transform="scale(0.4)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="5.5s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="15,-30; -10,120" dur="5.8s" repeatCount="indefinite" begin="4s" />
    <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.1; 0.8; 1" dur="5.8s" repeatCount="indefinite" begin="4s" />
    <g transform="scale(0.5)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; -360" dur="4.5s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="780,-20; 820,120" dur="4.2s" repeatCount="indefinite" begin="0.3s" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="4.2s" repeatCount="indefinite" begin="0.3s" />
    <g transform="scale(0.65)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; 360" dur="3s" repeatCount="indefinite" /></use></g>
  </g>
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" values="280,-10; 310,120" dur="7s" repeatCount="indefinite" begin="3.5s" />
    <animate attributeName="opacity" values="0; 0.6; 0.6; 0" keyTimes="0; 0.1; 0.8; 1" dur="7s" repeatCount="indefinite" begin="3.5s" />
    <g transform="scale(0.3)"><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0; -360" dur="6s" repeatCount="indefinite" /></use></g>
  </g>
</svg>
