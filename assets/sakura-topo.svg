<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <defs>
    <!-- Gradiente suave da pétala (Estilo Anime) -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFB7C5" />
    </linearGradient>
    
    <!-- Desenho curvo e delicado da pétala -->
    <path id="petal" d="M0,0 C10,-10 15,-25 5,-32 C2,-35 -2,-35 -5,-32 C-15,-25 -10,-10 0,0 Z" fill="url(#petalGrad)" />
    
    <!-- Flor completa -->
    <g id="flower">
       <use href="#petal" transform="rotate(0)" />
       <use href="#petal" transform="rotate(72)" />
       <use href="#petal" transform="rotate(144)" />
       <use href="#petal" transform="rotate(216)" />
       <use href="#petal" transform="rotate(288)" />
       <circle cx="0" cy="-2" r="4" fill="#FF9EBD" />
    </g>
  </defs>

  <!-- Fundo transparente -->
  <rect width="800" height="150" fill="transparent" />

  <g opacity="0.9">
    <!-- Galhos suaves em marrom acinzentado -->
    <path d="M0,20 Q80,50 150,30 T280,40" fill="none" stroke="#705446" stroke-width="3" stroke-linecap="round"/>
    <path d="M80,38 Q120,80 140,70" fill="none" stroke="#705446" stroke-width="2" stroke-linecap="round"/>
    <path d="M800,10 Q700,40 620,20 T500,30" fill="none" stroke="#705446" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Flores presas nos galhos -->
    <use href="#flower" x="150" y="30" transform="scale(0.6)" />
    <use href="#flower" x="80" y="38" transform="scale(0.8)" />
    <use href="#flower" x="140" y="70" transform="scale(0.5)" />
    <use href="#flower" x="620" y="20" transform="scale(0.7)" />
    <use href="#flower" x="500" y="30" transform="scale(0.6)" />
    <use href="#flower" x="700" y="30" transform="scale(0.8)" />
  </g>

  <!-- Pétalas caindo com animação orgânica -->
  <g transform="translate(100, -30)">
    <animateTransform attributeName="transform" type="translate" values="100,-30; 130,160" dur="4s" repeatCount="indefinite" />
    <use href="#petal" transform="scale(0.5)">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="4s" repeatCount="indefinite" />
  </g>

  <g transform="translate(250, -40)">
    <animateTransform attributeName="transform" type="translate" values="250,-40; 210,160" dur="5.5s" repeatCount="indefinite" />
    <use href="#petal" transform="scale(0.6)">
      <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.1; 0.8; 1" dur="5.5s" repeatCount="indefinite" />
  </g>

  <g transform="translate(400, -20)">
    <animateTransform attributeName="transform" type="translate" values="400,-20; 450,160" dur="6s" repeatCount="indefinite" />
    <use href="#petal" transform="scale(0.4)">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.1; 0.8; 1" dur="6s" repeatCount="indefinite" />
  </g>

  <g transform="translate(600, -50)">
    <animateTransform attributeName="transform" type="translate" values="600,-50; 570,160" dur="4.5s" repeatCount="indefinite" />
    <use href="#petal" transform="scale(0.55)">
      <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.8; 1" dur="4.5s" repeatCount="indefinite" />
  </g>

  <g transform="translate(720, -10)">
    <animateTransform attributeName="transform" type="translate" values="720,-10; 750,160" dur="5s" repeatCount="indefinite" />
    <use href="#petal" transform="scale(0.45)">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.1; 0.8; 1" dur="5s" repeatCount="indefinite" />
  </g>
</svg>
