<svg width="700" height="60" viewBox="0 0 700 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="star">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#F8B7CD"/>
    </g>
  </defs>

  <use href="#star" x="40" y="15">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.3;0.5" dur="1.6s" begin="0s" repeatCount="indefinite"/>
  </use>

  <use href="#star" x="120" y="40">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.2;0.5" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
  </use>

  <use href="#star" x="200" y="10">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.4;0.5" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
  </use>

  <use href="#star" x="560" y="15">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.3;0.5" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
  </use>

  <use href="#star" x="620" y="40">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.2;0.5" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
  </use>

  <use href="#star" x="660" y="10">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.5;1.4;0.5" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
  </use>
</svg>
